services:
  - type: web
    name: ned-transport-hub-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ALLOWED_EMAIL_DOMAINS
        value: "cloud.neduet.edu.pk,neduet.edu.pk,gmail.com"
      - key: PUBLIC_BASE_URL
        value: "https://ned-transport-hub-api.onrender.com"
      - key: FIRST_ADMIN_EMAIL
        value: "admin@neduet.edu.pk"
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      - key: FIRST_ADMIN_NAME
        value: "System Admin"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "NED Transport Hub"
      - key: PAYMENT_PROVIDER
        value: "mock"
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: "console"
      - key: REMINDERS_ENABLED
        value: "true"
      - key: REMINDER_MINUTES_BEFORE
        value: "30"
      - key: CAMPUS_GATES
        value: "Main Gate:24.9300,67.1140"
      - key: GATE_RADIUS_M
        value: "150"
      - key: NIGHT_START_HOUR
        value: "20"
      - key: NIGHT_END_HOUR
        value: "6"
      - key: CAMPUS_UTC_OFFSET_HOURS
        value: "5"
      - key: MAPBOX_TOKEN
        sync: false
      - key: CAMPUS_SECURITY_EMAIL
        sync: false
